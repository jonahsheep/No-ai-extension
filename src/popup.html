<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bye Bye Google AI</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">✦</div>
      <div>
        <h1>Bye Bye Google AI</h1>
        <p>Filter Google — you choose what to hide</p>
      </div>
      <label class="switch main-switch"><input id="enabled" type="checkbox" /><span class="slider"></span></label>
    </header>
    <div id="status" class="status">AI Overviews hidden by default — like Bye Bye v2.1</div>

    <section class="card">
      <div class="card-title">Core</div>
      <label class="row"><div class="row-text"><strong>Hide AI Overviews</strong><span>Bye Bye default — top & mid-page blocks</span></div><label class="switch"><input id="blockOverview" type="checkbox" /><span class="slider"></span></label></label>
      <label class="row"><div class="row-text"><strong>Hide AI Mode</strong><span>Tab + homepage pill + udm=50</span></div><label class="switch"><input id="blockAiMode" type="checkbox" /><span class="slider"></span></label></label>
      <label class="row"><div class="row-text"><strong>Just the links (udm=14)</strong><span>Web-only — completely disables AI server-side</span></div><label class="switch"><input id="webOnly" type="checkbox" /><span class="slider"></span></label></label>
    </section>

    <section class="card">
      <div class="card-title">Bye Bye parity — hide more (opt-in)</div>
      <label class="row"><div class="row-text"><strong>Sponsored / Ads</strong></div><label class="switch"><input id="hideAds" type="checkbox" /><span class="slider"></span></label></label>
      <label class="row"><div class="row-text"><strong>Shopping blocks</strong></div><label class="switch"><input id="hideShopping" type="checkbox" /><span class="slider"></span></label></label>
      <label class="row"><div class="row-text"><strong>Discussions & forums</strong></div><label class="switch"><input id="hideDiscussions" type="checkbox" /><span class="slider"></span></label></label>
      <label class="row"><div class="row-text"><strong>Videos</strong></div><label class="switch"><input id="hideVideos" type="checkbox" /><span class="slider"></span></label></label>
      <label class="row"><div class="row-text"><strong>People Also Ask</strong><span>Related questions</span></div><label class="switch"><input id="hidePAA" type="checkbox" /><span class="slider"></span></label></label>
      <label class="row"><div class="row-text"><strong>What people are saying</strong></div><label class="switch"><input id="hideWhatPeopleSaying" type="checkbox" /><span class="slider"></span></label></label>
    </section>

    <section class="card muted">
      <label class="row"><div class="row-text"><span>Aggressive AI badges (Generated by AI)</span></div><label class="switch"><input id="aggressive" type="checkbox" /><span class="slider"></span></label></label>
      <p class="hint">Tip: Bye Bye v2.1 hides AI mid-page too — this does. Use <code>w + space</code> in address bar for Web tab.</p>
    </section>

    <footer>
      <div class="stats"><span>Blocked:</span> <strong id="blockedCount">0</strong></div>
      <div class="links"><a id="optionsLink" href="#">Options</a> <span>·</span> <a id="reset" href="#">Reset</a></div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
