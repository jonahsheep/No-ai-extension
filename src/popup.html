<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>No AI</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">✦</div>
      <div>
        <h1>No AI</h1>
        <p>Block Google AI Overviews</p>
      </div>
      <label class="switch main-switch">
        <input id="enabled" type="checkbox" />
        <span class="slider"></span>
      </label>
    </header>

    <div id="status" class="status">Loading…</div>

    <section class="card">
      <label class="row">
        <div class="row-text">
          <strong>Hide AI Overview</strong>
          <span>Removes the AI summary block at the top of results</span>
        </div>
        <label class="switch"><input id="blockOverview" type="checkbox" /><span class="slider"></span></label>
      </label>
      <label class="row">
        <div class="row-text">
          <strong>Hide AI Mode</strong>
          <span>Removes AI Mode tab, pill, and blocks udm=50 pages</span>
        </div>
        <label class="switch"><input id="blockAiMode" type="checkbox" /><span class="slider"></span></label>
      </label>
      <label class="row">
        <div class="row-text">
          <strong>Strip AI Mode URLs</strong>
          <span>Auto-remove <code>?udm=50</code> if you land on AI Mode</span>
        </div>
        <label class="switch"><input id="stripUdm50" type="checkbox" /><span class="slider"></span></label>
      </label>
    </section>

    <section class="card accent">
      <div class="accent-head">
        <span class="badge">Higher note</span>
        <strong>Block all AI content</strong>
      </div>
      <label class="row">
        <div class="row-text">
          <span>Aggressively hide Gemini, “Generated by AI”, AI images badges and Workspace AI prompts on Google.</span>
        </div>
        <label class="switch"><input id="aggressive" type="checkbox" /><span class="slider"></span></label>
      </label>
      <label class="row">
        <div class="row-text">
          <strong>Just the links <span class="muted">(udm=14)</span></strong>
          <span>Force Google “Web” filter — no AI, shopping, or knowledge panels</span>
        </div>
        <label class="switch"><input id="webOnly" type="checkbox" /><span class="slider"></span></label>
      </label>
      <p class="hint">Tip: Aggressive mode may hide more — disable if something legit disappears. Web mode is the strongest “no-AI” view Google offers.</p>
    </section>

    <footer>
      <div class="stats">
        <span>Blocked this install:</span>
        <strong id="blockedCount">0</strong>
      </div>
      <div class="links">
        <a id="optionsLink" href="#">Options</a>
        <span>·</span>
        <a href="#" id="reset">Reset count</a>
      </div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
